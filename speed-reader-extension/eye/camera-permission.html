<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Speed Reader — camera access</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; background: #14151c; color: #ece9e2; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    main { max-width: 440px; padding: 32px; background: #1b1d27; border: 1px solid #2a2d3b; border-radius: 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { color: #a5a8b8; line-height: 1.5; font-size: 14px; }
    button { font: 600 14px inherit; background: #ece9e2; color: #14151c; border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Allow camera for attention tracking</h1>
    <p>Speed Reader uses your webcam to pause when you look away and to tune reading speed. Video is processed on this computer and never uploaded or saved.</p>
    <p>Chrome only asks once. You can revoke access anytime from chrome://settings/content/camera.</p>
    <button id="allow">Allow camera</button>
    <p id="status"></p>
  </main>
  <script src="camera-permission.js"></script>
</body>
</html>
