name: ci

# publish.yml calls this before publishing, so main is tested too.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs;
      # relax that instead of running Chrome with --no-sandbox.
      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm run test:unit

      - run: npm run test:e2e

      - run: npm run zip

      - name: Check zip layout
        run: |
          zip_file=$(ls dist/*.zip)
          unzip -l "$zip_file" | awk '{print $4}' | grep -qx 'manifest.json' \
            || { echo "::error::manifest.json is not at the root of $zip_file"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error
