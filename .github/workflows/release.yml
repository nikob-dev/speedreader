name: release

# Pushing a tag like v1.5.0 (on main): test, then publish to the Public listing.
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: cws-public
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main; public releases only ship from main."; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp release version from tag
        run: node scripts/stamp-version.mjs "${GITHUB_REF_NAME#v}"

      - run: npm run zip

      - name: Upload and publish to Public listing
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_PUBLIC_ITEM_ID }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$EXTENSION_ID" ]; then
            echo "::notice::DRY RUN — no CWS secrets; built $(ls dist/*.zip) but did not upload."
            exit 0
          fi
          npx chrome-webstore-upload --source dist/*.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --verify-tag
